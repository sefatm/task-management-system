<div class="row justify-content-center">
  <div class="col-lg-8 col-xl-7">
    <div class="d-flex align-items-center gap-3 mb-4">
      <a routerLink="/tasks" class="btn btn-outline-secondary btn-sm rounded-circle p-2" style="width: 36px; height: 36px;">
        <i class="bi bi-arrow-left"></i>
      </a>
      <div>
        <h3 class="fw-bold mb-0">{{ id ? 'Edit Task Details' : 'Assign New Task' }}</h3>
        <p class="text-muted small mb-0">{{ id ? 'Update task scope, priority, or deadline.' : 'Select an employee and define deliverables.' }}</p>
      </div>
    </div>

    <form class="panel p-4 p-md-5 shadow-sm" [formGroup]="form" (ngSubmit)="save()" novalidate>
      <!-- Title -->
      <div class="mb-4">
        <label class="form-label" for="taskTitle">Task Title</label>
        <input id="taskTitle" class="form-control" formControlName="title" placeholder="e.g. Conduct quarterly security audit" [class.is-invalid]="invalid('title')">
        <div class="invalid-feedback d-block" *ngIf="invalid('title')">
          Title is required (maximum 200 characters).
        </div>
      </div>

      <!-- Description -->
      <div class="mb-4">
        <label class="form-label" for="taskDesc">Detailed Description</label>
        <textarea id="taskDesc" class="form-control" rows="4" formControlName="description" 
                  placeholder="Outline context, requirements, acceptance criteria, or relevant links..."></textarea>
      </div>

      <div class="row g-3 mb-4">
        <!-- Assign To -->
        <div class="col-md-6">
          <label class="form-label" for="assignedTo">Assign To Employee</label>
          <select id="assignedTo" class="form-select" formControlName="assignedTo" [class.is-invalid]="invalid('assignedTo')">
            <option [ngValue]="null" disabled>Choose employee...</option>
            <option *ngFor="let a of assignees" [ngValue]="a.id">{{ a.fullName }} ({{ a.email }})</option>
          </select>
          <div class="invalid-feedback d-block" *ngIf="invalid('assignedTo')">
            Please choose a designated employee.
          </div>
          <div class="form-text text-warning small" *ngIf="assignees.length === 0">
            <i class="bi bi-exclamation-circle"></i> No employees available to assign.
          </div>
        </div>

        <!-- Priority -->
        <div class="col-md-3">
          <label class="form-label" for="priority">Priority</label>
          <select id="priority" class="form-select" formControlName="priority">
            <option *ngFor="let p of priorities" [value]="p">{{ p | label }}</option>
          </select>
        </div>

        <!-- Deadline -->
        <div class="col-md-3">
          <label class="form-label" for="deadline">Deadline</label>
          <input id="deadline" type="date" class="form-control" formControlName="deadline">
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 pt-3 border-top">
        <a routerLink="/tasks" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary" [disabled]="saving">
          <span *ngIf="saving" class="spinner-border spinner-border-sm me-1"></span>
          <span>{{ saving ? 'Saving…' : (id ? 'Save Changes' : 'Confirm & Assign Task') }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
