server.port=${PORT:8080}

# ---- Database (all values come from environment variables with sensible defaults for local development) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taskdb}?useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:super-secret-jwt-key-for-task-management-system-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---- CORS (comma separated list of allowed frontend origins) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
