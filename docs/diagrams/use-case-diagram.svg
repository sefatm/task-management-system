<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 620" width="100%" height="100%" style="background:#ffffff; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="actorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d2740"/>
      <stop offset="100%" stop-color="#2a3b60"/>
    </linearGradient>
    <linearGradient id="ucGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7f7"/>
      <stop offset="100%" stop-color="#e1eff0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="475" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1d2740">Use Case Diagram — Task Management System</text>

  <!-- System Boundary -->
  <rect x="230" y="55" width="490" height="545" rx="12" fill="#fafbfc" stroke="#0e7c86" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="245" y="65" width="220" height="26" rx="4" fill="#0e7c86"/>
  <text x="355" y="83" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">System: Task Management</text>

  <!-- ACTORS (Left) -->
  <!-- Admin -->
  <g transform="translate(70, 110)">
    <circle cx="35" cy="20" r="14" fill="none" stroke="#1d2740" stroke-width="2.5"/>
    <line x1="35" y1="34" x2="35" y2="65" stroke="#1d2740" stroke-width="2.5"/>
    <line x1="15" y1="46" x2="55" y2="46" stroke="#1d2740" stroke-width="2.5"/>
    <line x1="35" y1="65" x2="15" y2="92" stroke="#1d2740" stroke-width="2.5"/>
    <line x1="35" y1="65" x2="55" y2="92" stroke="#1d2740" stroke-width="2.5"/>
    <text x="35" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2740">ADMIN</text>
  </g>

  <!-- Manager -->
  <g transform="translate(70, 280)">
    <circle cx="35" cy="20" r="14" fill="none" stroke="#1d2740" stroke-width="2.5"/>
    <line x1="35" y1="34" x2="35" y2="65" stroke="#1d2740" stroke-width="2.5"/>
    <line x1="15" y1="46" x2="55" y2="46" stroke="#1d2740" stroke-width="2.5"/>
    <line x1="35" y1="65" x2="15" y2="92" stroke="#1d2740" stroke-width="2.5"/>
    <line x1="35" y1="65" x2="55" y2="92" stroke="#1d2740" stroke-width="2.5"/>
    <text x="35" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2740">MANAGER</text>
  </g>

  <!-- ACTORS (Right) -->
  <!-- Employee -->
  <g transform="translate(810, 280)">
    <circle cx="35" cy="20" r="14" fill="none" stroke="#1d2740" stroke-width="2.5"/>
    <line x1="35" y1="34" x2="35" y2="65" stroke="#1d2740" stroke-width="2.5"/>
    <line x1="15" y1="46" x2="55" y2="46" stroke="#1d2740" stroke-width="2.5"/>
    <line x1="35" y1="65" x2="15" y2="92" stroke="#1d2740" stroke-width="2.5"/>
    <line x1="35" y1="65" x2="55" y2="92" stroke="#1d2740" stroke-width="2.5"/>
    <text x="35" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2740">EMPLOYEE</text>
  </g>

  <!-- USE CASES (Ovals) -->
  <!-- UC1: Login (Stateless JWT) -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="115" rx="100" ry="24" fill="url(#ucGrad)" stroke="#0e7c86" stroke-width="1.8"/>
    <text x="475" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2740">Login (Stateless JWT)</text>
  </g>

  <!-- UC2: View Role Dashboard -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="168" rx="100" ry="24" fill="url(#ucGrad)" stroke="#0e7c86" stroke-width="1.8"/>
    <text x="475" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2740">View Role Dashboard</text>
  </g>

  <!-- UC3: Manage Users (CRUD) -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="221" rx="100" ry="24" fill="url(#ucGrad)" stroke="#0e7c86" stroke-width="1.8"/>
    <text x="475" y="226" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2740">Manage Users (CRUD)</text>
  </g>

  <!-- UC4: View All Tasks & Filter -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="274" rx="105" ry="24" fill="url(#ucGrad)" stroke="#0e7c86" stroke-width="1.8"/>
    <text x="475" y="279" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2740">View All Tasks &amp; Filter</text>
  </g>

  <!-- UC5: Assign & Edit Tasks -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="327" rx="105" ry="24" fill="url(#ucGrad)" stroke="#0e7c86" stroke-width="1.8"/>
    <text x="475" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2740">Assign &amp; Edit Tasks</text>
  </g>

  <!-- UC6: View Assigned Team Tasks -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="380" rx="110" ry="24" fill="url(#ucGrad)" stroke="#0e7c86" stroke-width="1.8"/>
    <text x="475" y="385" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2740">View Assigned Team Tasks</text>
  </g>

  <!-- UC7: View My Tasks -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="433" rx="100" ry="24" fill="url(#ucGrad)" stroke="#0e7c86" stroke-width="1.8"/>
    <text x="475" y="438" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2740">View My Tasks</text>
  </g>

  <!-- UC8: Update Status (Forward-Only) -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="486" rx="115" ry="24" fill="url(#ucGrad)" stroke="#0e7c86" stroke-width="1.8"/>
    <text x="475" y="491" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2740">Update Status (Forward-Only)</text>
  </g>

  <!-- UC9: Download PDF Report -->
  <g filter="url(#shadow)">
    <ellipse cx="475" cy="539" rx="100" ry="24" fill="url(#ucGrad)" stroke="#0e7c86" stroke-width="1.8"/>
    <text x="475" y="544" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2740">Download PDF Report</text>
  </g>

  <!-- CONNECTIONS -->
  <!-- Admin Connections -->
  <path d="M125 150 L375 115" stroke="#1d2740" stroke-width="1.4"/>
  <path d="M125 155 L375 168" stroke="#1d2740" stroke-width="1.4"/>
  <path d="M125 165 L375 221" stroke="#1d2740" stroke-width="1.4"/>
  <path d="M125 170 L370 274" stroke="#1d2740" stroke-width="1.4"/>
  <path d="M125 175 L370 327" stroke="#1d2740" stroke-width="1.4"/>
  <path d="M125 185 L375 539" stroke="#1d2740" stroke-width="1.4"/>

  <!-- Manager Connections -->
  <path d="M125 320 L375 115" stroke="#0e7c86" stroke-width="1.4"/>
  <path d="M125 325 L375 168" stroke="#0e7c86" stroke-width="1.4"/>
  <path d="M125 335 L370 327" stroke="#0e7c86" stroke-width="1.4"/>
  <path d="M125 345 L365 380" stroke="#0e7c86" stroke-width="1.4"/>
  <path d="M125 355 L375 539" stroke="#0e7c86" stroke-width="1.4"/>

  <!-- Employee Connections -->
  <path d="M825 320 L575 115" stroke="#5b6577" stroke-width="1.4"/>
  <path d="M825 325 L575 168" stroke="#5b6577" stroke-width="1.4"/>
  <path d="M825 340 L575 433" stroke="#5b6577" stroke-width="1.4"/>
  <path d="M825 350 L590 486" stroke="#5b6577" stroke-width="1.4"/>
</svg>
