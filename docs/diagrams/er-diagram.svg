<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" width="100%" height="100%" style="background:#ffffff; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="425" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1d2740">Entity Relationship (ER) Diagram — MySQL 8</text>
  <text x="425" y="65" text-anchor="middle" font-size="13" fill="#5b6577">Database: taskdb</text>

  <!-- TABLE: USERS -->
  <g transform="translate(60, 100)" filter="url(#cardShadow)">
    <!-- Header -->
    <rect x="0" y="0" width="310" height="42" rx="8" fill="#1d2740"/>
    <text x="15" y="26" font-size="15" font-weight="700" fill="#ffffff">USERS</text>
    <text x="295" y="26" text-anchor="end" font-size="11" fill="#cbd5e1">[Table]</text>

    <!-- Body -->
    <rect x="0" y="42" width="310" height="270" rx="0" fill="#ffffff" stroke="#dde2ea" stroke-width="1.5"/>
    <rect x="0" y="304" width="310" height="8" rx="8" fill="#ffffff"/>

    <!-- Columns -->
    <!-- id -->
    <text x="15" y="68" font-size="12" font-weight="700" fill="#0e7c86">PK</text>
    <text x="45" y="68" font-size="12" font-weight="600" fill="#1d2740">id</text>
    <text x="295" y="68" text-anchor="end" font-size="11" fill="#5b6577">BIGINT AUTO_INCREMENT</text>
    <line x1="10" y1="78" x2="300" y2="78" stroke="#f1f5f9"/>

    <!-- full_name -->
    <text x="45" y="98" font-size="12" fill="#1d2740">full_name</text>
    <text x="295" y="98" text-anchor="end" font-size="11" fill="#5b6577">VARCHAR(100) NOT NULL</text>
    <line x1="10" y1="108" x2="300" y2="108" stroke="#f1f5f9"/>

    <!-- email -->
    <text x="15" y="128" font-size="12" font-weight="700" fill="#d97706">UK</text>
    <text x="45" y="128" font-size="12" font-weight="600" fill="#1d2740">email</text>
    <text x="295" y="128" text-anchor="end" font-size="11" fill="#5b6577">VARCHAR(150) NOT NULL</text>
    <line x1="10" y1="138" x2="300" y2="138" stroke="#f1f5f9"/>

    <!-- password -->
    <text x="45" y="158" font-size="12" fill="#1d2740">password</text>
    <text x="295" y="158" text-anchor="end" font-size="11" fill="#5b6577">VARCHAR(255) [BCrypt]</text>
    <line x1="10" y1="168" x2="300" y2="168" stroke="#f1f5f9"/>

    <!-- role -->
    <text x="45" y="188" font-size="12" fill="#1d2740">role</text>
    <text x="295" y="188" text-anchor="end" font-size="11" fill="#5b6577">ENUM(ADMIN, MGR, EMP)</text>
    <line x1="10" y1="198" x2="300" y2="198" stroke="#f1f5f9"/>

    <!-- manager_id -->
    <text x="15" y="218" font-size="12" font-weight="700" fill="#2563eb">FK</text>
    <text x="45" y="218" font-size="12" font-weight="600" fill="#1d2740">manager_id</text>
    <text x="295" y="218" text-anchor="end" font-size="11" fill="#5b6577">BIGINT NULL [users.id]</text>
    <line x1="10" y1="228" x2="300" y2="228" stroke="#f1f5f9"/>

    <!-- created_at -->
    <text x="45" y="248" font-size="12" fill="#1d2740">created_at</text>
    <text x="295" y="248" text-anchor="end" font-size="11" fill="#5b6577">DATETIME CURRENT_TS</text>
    <line x1="10" y1="258" x2="300" y2="258" stroke="#f1f5f9"/>

    <!-- active -->
    <text x="45" y="278" font-size="12" fill="#1d2740">active</text>
    <text x="295" y="278" text-anchor="end" font-size="11" fill="#5b6577">BOOLEAN DEFAULT TRUE</text>
  </g>

  <!-- SELF RELATION (users.manager_id -> users.id) -->
  <path d="M 60 318 C 15 318, 15 168, 60 168" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="10" y="245" font-size="10.5" font-weight="600" fill="#2563eb" transform="rotate(-90 10 245)">manages (1 : N)</text>

  <!-- TABLE: TASKS -->
  <g transform="translate(480, 100)" filter="url(#cardShadow)">
    <!-- Header -->
    <rect x="0" y="0" width="320" height="42" rx="8" fill="#0e7c86"/>
    <text x="15" y="26" font-size="15" font-weight="700" fill="#ffffff">TASKS</text>
    <text x="305" y="26" text-anchor="end" font-size="11" fill="#ccfbf1">[Table]</text>

    <!-- Body -->
    <rect x="0" y="42" width="320" height="340" rx="0" fill="#ffffff" stroke="#dde2ea" stroke-width="1.5"/>
    <rect x="0" y="374" width="320" height="8" rx="8" fill="#ffffff"/>

    <!-- Columns -->
    <!-- id -->
    <text x="15" y="68" font-size="12" font-weight="700" fill="#0e7c86">PK</text>
    <text x="45" y="68" font-size="12" font-weight="600" fill="#1d2740">id</text>
    <text x="305" y="68" text-anchor="end" font-size="11" fill="#5b6577">BIGINT AUTO_INCREMENT</text>
    <line x1="10" y1="78" x2="310" y2="78" stroke="#f1f5f9"/>

    <!-- title -->
    <text x="45" y="98" font-size="12" fill="#1d2740">title</text>
    <text x="305" y="98" text-anchor="end" font-size="11" fill="#5b6577">VARCHAR(200) NOT NULL</text>
    <line x1="10" y1="108" x2="310" y2="108" stroke="#f1f5f9"/>

    <!-- description -->
    <text x="45" y="128" font-size="12" fill="#1d2740">description</text>
    <text x="305" y="128" text-anchor="end" font-size="11" fill="#5b6577">TEXT NULL</text>
    <line x1="10" y1="138" x2="310" y2="138" stroke="#f1f5f9"/>

    <!-- status -->
    <text x="45" y="158" font-size="12" fill="#1d2740">status</text>
    <text x="305" y="158" text-anchor="end" font-size="11" fill="#5b6577">ENUM(PENDING, IN_PROG, DONE)</text>
    <line x1="10" y1="168" x2="310" y2="168" stroke="#f1f5f9"/>

    <!-- priority -->
    <text x="45" y="188" font-size="12" fill="#1d2740">priority</text>
    <text x="305" y="188" text-anchor="end" font-size="11" fill="#5b6577">ENUM(LOW, MEDIUM, HIGH)</text>
    <line x1="10" y1="198" x2="310" y2="198" stroke="#f1f5f9"/>

    <!-- deadline -->
    <text x="45" y="218" font-size="12" fill="#1d2740">deadline</text>
    <text x="305" y="218" text-anchor="end" font-size="11" fill="#5b6577">DATE NULL</text>
    <line x1="10" y1="228" x2="310" y2="228" stroke="#f1f5f9"/>

    <!-- assigned_to -->
    <text x="15" y="248" font-size="12" font-weight="700" fill="#2563eb">FK</text>
    <text x="45" y="248" font-size="12" font-weight="600" fill="#1d2740">assigned_to</text>
    <text x="305" y="248" text-anchor="end" font-size="11" fill="#5b6577">BIGINT [users.id]</text>
    <line x1="10" y1="258" x2="310" y2="258" stroke="#f1f5f9"/>

    <!-- assigned_by -->
    <text x="15" y="278" font-size="12" font-weight="700" fill="#2563eb">FK</text>
    <text x="45" y="278" font-size="12" font-weight="600" fill="#1d2740">assigned_by</text>
    <text x="305" y="278" text-anchor="end" font-size="11" fill="#5b6577">BIGINT [users.id]</text>
    <line x1="10" y1="288" x2="310" y2="288" stroke="#f1f5f9"/>

    <!-- created_at -->
    <text x="45" y="308" font-size="12" fill="#1d2740">created_at</text>
    <text x="305" y="308" text-anchor="end" font-size="11" fill="#5b6577">DATETIME CURRENT_TS</text>
    <line x1="10" y1="318" x2="310" y2="318" stroke="#f1f5f9"/>

    <!-- updated_at -->
    <text x="45" y="338" font-size="12" fill="#1d2740">updated_at</text>
    <text x="305" y="338" text-anchor="end" font-size="11" fill="#5b6577">DATETIME ON UPDATE</text>
  </g>

  <!-- RELATIONSHIPS BETWEEN USERS AND TASKS -->
  <!-- assigned_to -->
  <path d="M 370 168 C 425 168, 425 348, 480 348" fill="none" stroke="#0e7c86" stroke-width="2"/>
  <rect x="390" y="240" width="70" height="20" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="425" y="254" text-anchor="middle" font-size="10.5" font-weight="600" fill="#166534">assigned_to</text>

  <!-- assigned_by -->
  <path d="M 370 190 C 425 190, 425 378, 480 378" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="390" y="295" width="70" height="20" rx="4" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="425" y="309" text-anchor="middle" font-size="10.5" font-weight="600" fill="#4338ca">assigned_by</text>

  <!-- CARDINALITY NOTES -->
  <g transform="translate(150, 485)">
    <rect x="0" y="0" width="550" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="275" y="22" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1d2740">Cardinalities:</text>
    <text x="275" y="38" text-anchor="middle" font-size="11" fill="#64748b">USERS (Manager) 1 : N USERS (Employee)  |  USERS 1 : N TASKS (assigned_to)  |  USERS 1 : N TASKS (assigned_by)</text>
  </g>
</svg>
